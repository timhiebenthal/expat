[project]
name = "expat-calc"
version = "0.1.0"
description = "Expat relocation cost-of-living and earnings comparison"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- constraints that encode breakage we actually hit. Keep these. ---
    # pyarrow hard-requires numpy>=2 but declares no numpy dependency at all,
    # so nothing in the graph surfaces the conflict; without this floor uv
    # will happily resolve numpy 1.x.
    "numpy>=2.0.2",
    # --- everything else: major-version ceiling only. ---
    # uv.lock holds the exact versions, so these are not pins in the usual
    # sense - they exist to stop `uv lock --upgrade` from crossing a breaking
    # release unattended.
    "pandas<4",
    "beautifulsoup4",
    "requests",
    "yfinance>=0.2.65",
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "streamlit<2",
    "duckdb<2",
]

[dependency-groups]
dev = [
    "pytest",
    "shandy-sqlfmt[jinjafmt]==0.21.3",
]

# This is an application, not a library - nothing to build or publish.
[tool.uv]
package = false

[tool.pytest.ini_options]
# llm_client.py lives at the repo root, not in a package.
pythonpath = ["."]
testpaths = ["tests"]
